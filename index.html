function applyTheme(themeOverride){let t=themeOverride||data.theme||themePresets.peach;document.documentElement.style.setProperty("--bg",t.bg||"#fff8f1");document.documentElement.style.setProperty("--accent",t.accent||"#d9784c");document.documentElement.style.setProperty("--card",t.card||"#ffffff");let dark=(t.bg||"").toLowerCase()==="#24232b"||((parseInt((t.bg||"#ffffff").slice(1,3),16)*299+parseInt((t.bg||"#ffffff").slice(3,5),16)*587+parseInt((t.bg||"#ffffff").slice(5,7),16)*114)/1000<120);document.documentElement.style.setProperty("--ink",dark?"#f5edf8":"#49372f");document.documentElement.style.setProperty("--muted",dark?"#c4b8cc":"#927f73");document.documentElement.style.setProperty("--line",dark?"#4b4654":"#f0dfd1");document.documentElement.style.setProperty("--soft",dark?"#45404f":"#ffeadb");let brand=document.querySelector(".brand");let logo=t.logoImage?`<img src="${t.logoImage}" style="width:28px;height:28px;object-fit:contain;vertical-align:middle">`:esc(t.logo||"🍑");if(brand)brand.innerHTML=`${logo} ${esc(t.title||"今天吃什麼")} <div class="sub">我的美食與飲料口袋</div>`;let drawerTitle=document.querySelector(".drawer h2");if(drawerTitle)drawerTitle.innerHTML=`${logo} ${esc(t.drawerTitle||t.title||"今天吃什麼")}`;document.querySelectorAll(".hero").forEach(el=>{el.style.background=`linear-gradient(135deg,var(--soft),var(--bg))`});}
function bindThemeSettings(){let t=data.theme||{...themePresets.peach};let preset=$("themePreset");if(!preset)return;let original=JSON.parse(JSON.stringify(data.theme||themePresets.peach));let found=Object.keys(themePresets).find(k=>themePresets[k].bg===t.bg&&themePresets[k].accent===t.accent);preset.value=found||"custom";const draft=()=>({...t,homeIcon:$("homeIcon")?.value.trim()||"🍽️",bg:$("themeBg").value,accent:$("themeAccent").value,card:$("themeCard").value,logo:$("themeLogo").value==="自訂圖片"?(t.logo||"🍑"):$("themeLogo").value,title:$("siteTitle").value.trim()||"今天吃什麼",drawerTitle:$("drawerTitle").value.trim()||$("siteTitle").value.trim()||"今天吃什麼"});const updatePreview=()=>{let d=draft();applyTheme(d);let pv=$("themePreview");if(pv){pv.style.background=d.bg;pv.style.color=d.bg==="#24232b"?"#f5edf8":"var(--ink)";$("previewCard").style.background=d.card;$("previewButton").style.background=d.accent;$("previewLogo").textContent=d.logo;$("previewTitle").textContent=d.title}};preset.onchange=()=>{let p=themePresets[preset.value];if(p){$("themeBg").value=p.bg;$("themeAccent").value=p.accent;$("themeCard").value=p.card;$("themeLogo").value=p.logo;updatePreview()}};["themeBg","themeAccent","themeCard","themeLogo","siteTitle","drawerTitle","homeIcon"].forEach(id=>{if($(id)){ $(id).addEventListener("input",updatePreview);$(id).addEventListener("change",updatePreview)}});if($("logoUpload"))$("logoUpload").onchange=e=>{let f=e.target.files[0];if(!f)return;if(f.size>500000){alert("圖片太大，請選擇小於 500KB 的圖片。");e.target.value="";return}let r=new FileReader();r.onload=()=>{t={...t,logoImage:r.result};updatePreview()};r.readAsDataURL(f)};if($("saveTheme"))$("saveTheme").onclick=()=>{data.theme={...(data.theme||{}),...draft(),logoImage:t.logoImage||data.theme?.logoImage||"",name:themePresets[preset.value]?.name||"自訂"};save();applyTheme();alert("主題已儲存！");render()};if($("resetTheme"))$("resetTheme").onclick=()=>{t={...themePresets.peach,logoImage:""};$("themeBg").value=t.bg;$("themeAccent").value=t.accent;$("themeCard").value=t.card;$("themeLogo").value=t.logo;$("siteTitle").value="今天吃什麼";$("drawerTitle").value="今天吃什麼";preset.value="peach";updatePreview()};if($("cancelTheme"))$("cancelTheme").onclick=()=>{applyTheme(original);page="home";render()};updatePreview()}

function render(){const v=$("view");if(page==="home")v.innerHTML=homeView();else if(page==="restaurants"||page==="drinks")v.innerHTML=listView(page==="restaurants"?"餐廳":"飲料店");else if(page==="favorites")v.innerHTML=favView();else if(page==="history")v.innerHTML=historyView();else if(page==="regions")v.innerHTML=regionView();else if(page==="menus")v.innerHTML=menuView();else if(page.startsWith("cat:")){let c=(data.categories||[]).find(x=>x.id===page.slice(4));v.innerHTML=c?categoryView(c):homeView()}else v.innerHTML=settingsView();applyTheme();bind();} 
function categoryView(c){let shops=data.shops.filter(s=>s.kind===c.name&&shopMatchesRegion(s));return `<div class="sectionhead"><h1>${esc(c.icon||"🍽️")} ${esc(c.name)}</h1><button data-add="${esc(c.name)}">＋ 新增店家</button></div><p class="muted">這是你的自訂分類，可以在個人化設定中更改名稱與圖案。</p>${shopCards(shops)}`}
function homeView(){let open=data.shops.filter(s=>shopMatchesRegion(s)&&isOpen(s)===true);let unknown=data.shops.filter(s=>shopMatchesRegion(s)&&isOpen(s)===null);return `<section class="hero"><span class="pill">依你設定的營業時間</span><h1>${esc(data.theme?.homeIcon||"🍽️")} 今天想去哪裡？</h1><div>首頁自動整理目前營業中的店家；自訂分類可從側邊選單進入。</div><div class="tabs"><button class="${kind==="餐廳"?"active":""}" data-kind="餐廳">🍜 餐廳</button><button class="${kind==="飲料店"?"active":""}" data-kind="飲料店">🧋 飲料店</button><button class="${kind==="全部"?"active":""}" data-kind="全部">全部</button></div><div class="row"><span class="pill">🟢 目前營業 ${open.filter(s=>kind==="全部"||s.kind===kind).length} 間</span><span class="pill">🕒 尚未設定時間 ${unknown.filter(s=>kind==="全部"||s.kind===kind).length} 間</span></div></section><div class="sectionhead"><h2>現在有開</h2><button class="secondary smallbtn" data-page="regions">篩選地區</button></div>${shopCards(open.filter(s=>kind==="全部"||s.kind===kind))}<div class="sectionhead"><h2>尚未設定營業時間</h2></div>${shopCards(unknown.filter(s=>kind==="全部"||s.kind===kind))}`}
function shopCards(shops){if(!shops.length)return `<div class="empty">這裡還沒有店家。<br>可以先從「餐廳」或「飲料店」新增一間。</div>`;return `<div class="grid">${shops.map(s=>`<article class="card"><div class="row"><div class="shopname">${esc(s.brandName||s.name)}</div><span class="tag ${isOpen(s)===false?"closed":""}">${isOpen(s)===true?"營業中":isOpen(s)===false?"目前未營業":"未設定時間"}</span></div><div class="muted">${esc(s.kind)}${s.branchName?" · "+esc(s.branchName):""}</div><div class="row" style="margin:6px 0"><button type="button" class="ghost smallbtn" data-add-branch="${s.id}">＋ 新增分店</button></div><div class="muted">${esc(regionLabel(s))}</div><p>${esc(s.note||"")}</p><div class="row"><button class="secondary smallbtn" data-record="${s.id}">✍️ 記一筆</button><button class="ghost smallbtn" data-edit="${s.id}">編輯</button><button class="ghost smallbtn" data-menu="${s.id}">菜單</button></div></article>`).join("")}</div>`}
function listView(k){let shops=data.shops.filter(s=>s.kind===k&&shopMatchesRegion(s));return `<div class="sectionhead"><h1>${k==="餐廳"?"🍜 餐廳":"🧋 飲料店"}</h1></div><div class="row"><button data-add="${k}">＋ 新增店家</button></div><p class="muted">品牌與分店分開管理；要替同一品牌新增其他分店，可按店名下方的「＋ 新增分店」。</p>${shopCards(shops)}`}
function favView(){return `<h1>♡ 口袋名單</h1><div class="tabs"><button class="${kind==="餐廳"?"active":""}" data-kind="餐廳">餐廳</button><button class="${kind==="飲料店"?"active":""}" data-kind="飲料店">飲料店</button><button class="${kind==="全部"?"active":""}" data-kind="全部">全部</button></div>${shopCards(data.shops.filter(s=>(kind==="全部"||s.kind===kind)&&s.favorite))}`}
function historyView(){return `<h1>📖 吃過／喝過記錄</h1>${data.records.length?data.records.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(r=>{let s=data.shops.find(x=>x.id===r.shopId);return `<article class="card"><div class="row"><b>${esc(s?.name||"已刪除店家")}</b><span class="pill">${esc(r.date)}</span></div><div>${esc(r.items)}</div><div class="muted">${esc(r.custom||"")}</div><div class="row"><b>NT$ ${esc(r.amount||"0")}</b><span class="muted">${esc(r.note||"")}</span><button class="ghost smallbtn fit" data-delrecord="${r.id}">刪除</button></div></article>`}).join(""):`<div class="empty">還沒有吃喝紀錄。<br>到店家卡片點「記一筆」就能新增。</div>`}`}
function regionView(){return `<h1>📍 地區篩選</h1><div class="card"><div class="field"><label>縣市</label><select id="county"><option>全部</option>${Object.keys(counties).map(c=>`<option ${data.regionCounty===c?"selected":""}>${c}</option>`).join("")}</select></div><div class="field"><label>鄉鎮市區</label><select id="town"><option>全部</option>${(counties[data.regionCounty]||[]).map(t=>`<option ${data.regionTown===t?"selected":""}>${t}</option>`).join("")}</select></div><button id="applyRegion">套用篩選</button><button class="secondary" id="clearRegion">顯示全台灣</button></div><div class="muted">地區清單為手動篩選用；店家地址需自行填寫，網站不會自動驗證地址。</div>`}
function menuView(){return `<h1>🧾 菜單管理</h1><p class="muted">點選店家即可直接瀏覽實際菜單圖片；需要新增或修改時，再進入編輯模式。菜單文字目前需手動整理。</p>${data.shops.length?data.shops.map(s=>`<article class="card"><div class="row"><b>${esc(s.name)}</b><button class="secondary smallbtn" data-menu="${s.id}">查看菜單</button></div><div class="muted">${(s.menuItems||[]).length} 個餐點選項 · ${(s.menus||[]).length} 張菜單圖片</div></article>`).join(""):`<div class="empty">先新增餐廳或飲料店，再管理菜單。</div>`}`}
function settingsView(){let t=data.theme||{name:"奶油蜜桃",bg:"#fff8f1",accent:"#d9784c",card:"#ffffff",logo:"🍑"};return `<h1>⚙️ 個人化設定</h1>
<div class="card"><h3>🎨 首頁主題與顏色</h3><p class="muted">選一套配色，或自行調整背景、按鈕與卡片顏色。設定會保存在這台裝置。</p><div class="field"><label>網站主標題</label><input id="siteTitle" value="${esc(t.title||"今天吃什麼")}" placeholder="例如：我的美食日記"></div><div class="field"><label>側邊選單標題</label><input id="drawerTitle" value="${esc(t.drawerTitle||"今天吃什麼")}" placeholder="例如：我的口袋清單"></div>
<div class="field"><label>預設主題</label><select id="themePreset"><option value="peach">奶油蜜桃</option><option value="pink">櫻花粉</option><option value="mint">薄荷綠</option><option value="blue">天空藍</option><option value="lavender">薰衣草</option><option value="dark">夜間深色</option><option value="custom">自訂顏色</option></select></div>
<div class="row"><div class="field"><label>背景顏色</label><input type="color" id="themeBg" value="${esc(t.bg)}"></div><div class="field"><label>按鈕／強調色</label><input type="color" id="themeAccent" value="${esc(t.accent)}"></div><div class="field"><label>卡片顏色</label><input type="color" id="themeCard" value="${esc(t.card)}"></div></div>
<div class="field"><label>即時預覽（選顏色時會立即變化）</label><div id="themePreview" style="border:1px solid var(--line);border-radius:16px;padding:14px;background:${esc(t.bg)};color:${t.bg==="#24232b"?"#f5edf8":"#49372f"}"><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><span id="previewLogo" style="font-size:24px">${esc(t.logo||"🍑")}</span><b id="previewTitle">${esc(t.title||"今天吃什麼")}</b></div><div id="previewCard" style="border-radius:12px;padding:12px;background:${esc(t.card)}"><div style="font-weight:700;margin-bottom:8px">目前營業中的店家</div><button type="button" id="previewButton" style="background:${esc(t.accent)};color:#fff;border:0;border-radius:10px;padding:8px 12px">餐廳　飲料店</button></div></div></div>
<div class="field"><label>首頁專屬圖案（可輸入手機鍵盤 Emoji）</label><input id="homeIcon" value="${esc(t.homeIcon||"🍽️")}" maxlength="12" placeholder="例如：🍢、🧋、🐻"><div class="muted">這個圖案只顯示在首頁標題旁，和網站／側邊選單標誌分開設定。</div></div><div class="field"><label>網站／側邊選單標誌</label><select id="themeLogo">${["🍑","🌷","🐱","🐻","🐰","☁️","🌙","⭐","🍓","🍋","🧋","🍜","🌸","🪴","🎀","☕","自訂圖片"].map(x=>`<option ${t.logo===x?"selected":""}>${x}</option>`).join("")}</select></div>
<div class="field"><label>上傳自己的首頁圖案（圖片）</label><input type="file" id="logoUpload" accept="image/*"><div class="muted">圖片會保存在這台裝置。建議使用小於 500KB 的圖片。</div>${t.logoImage?`<img src="${t.logoImage}" style="width:72px;height:72px;object-fit:contain;border-radius:12px;background:#fff;padding:5px">`:""}</div>
<div class="row"><button id="saveTheme">儲存主題</button><button class="secondary" id="resetTheme">恢復預設</button><button class="ghost" id="cancelTheme">取消變更</button></div>
<div class="muted" style="margin-top:8px">主題設定只改變外觀，不會刪除你的店家、菜單或紀錄。</div></div>
<div class="card"><h3>📋 側邊選單與自訂分類</h3><p class="muted">每個選單項目都可自訂名稱與圖案；新增「小吃、燒烤、火鍋」等分類後，會出現在直立式側邊選單，點進去可管理該分類店家。</p><h4>現有選單</h4>${navItems().map(n=>`<div class="row" style="margin:8px 0"><label class="check" style="flex:1"><input type="checkbox" data-nav="${n.id}" ${n.show?"checked":""} ${n.id==="home"?"disabled":""}>${esc(n.icon)} ${esc(n.label)}</label>${n.builtin?`<button type="button" class="ghost smallbtn fit" data-editnav="${n.id}">改名稱／圖案</button>`:`<button type="button" class="ghost smallbtn fit" data-editcat="${n.categoryId}">編輯</button><button type="button" class="danger smallbtn fit" data-deletecat="${n.categoryId}">刪除</button>`}</div>`).join("")}<div class="field"><label>新增分類名稱</label><input id="newCategoryName" placeholder="例如：小吃、燒烤、火鍋、早餐"></div><div class="field"><label>分類圖案（Emoji）</label><input id="newCategoryIcon" value="🍢" maxlength="8" placeholder="🍢"></div><button id="addCategory">＋ 新增側邊選單分類</button><div id="editCategoryArea"></div><p class="muted">刪除分類前會先提醒；若已有該分類店家，不會直接刪除店家資料。</p></div>
<div class="card"><h3>🧋 客製化選項管理</h3><p class="muted">不要受預設大分類限制。你可以自己建立任何選項，例如「微糖、去冰、加辣、醬料另外放、不要香菜」；之後記錄消費時可勾選多個選項，也能再補充當次專屬內容。</p><div class="field"><label>新增自己的客製化選項</label><input id="newCustomOption" placeholder="輸入你想建立的選項，例如：醬料另外放"></div><button type="button" id="addCustomOption">＋ 建立選項</button><h4>已建立的選項</h4><div id="customOptionList">${(data.customOptions||[]).map((x,i)=>`<div class="row" style="margin:6px 0"><span style="flex:1">${esc(x)}</span><button type="button" class="danger smallbtn fit" data-delcustomoption="${i}">刪除</button></div>`).join("")||'<p class="muted">目前還沒有自訂選項，請在上方新增。</p>'}</div></div> <div class="card"><h3>💾 資料備份</h3><button id="export">匯出資料備份</button><label class="field">匯入備份 JSON<input id="importFile" type="file" accept=".json,application/json"></label><p class="muted">更換裝置或清除網站資料前，請先匯出備份。</p></div>
<div class="card"><h3>資料管理</h3><button class="danger" id="clearAll">清除這個原型的全部資料</button></div>`}
function shopForm(s={}){return `<h1>${s.id?"編輯":"新增"}${esc(s.kind||"店家")}</h1><form id="shopForm"><input type="hidden" name="id" value="${esc(s.id||"")}"><div class="field"><label>店家類型</label><select name="kind"><option ${s.kind==="餐廳"?"selected":""}>餐廳</option><option ${s.kind==="飲料店"?"selected":""}>飲料店</option>${(data.categories||[]).map(c=>`<option ${s.kind===c.name?"selected":""}>${esc(c.name)}</option>`).join("")}</select></div><div class="field"><label>品牌／店名（必填）</label><input name="brandName" required value="${esc(s.brandName||String(s.name||"").replace(/[（(][^（）()]*店[）)]$/,"").trim())}" placeholder="例如：築間幸福鍋物"></div><div class="field"><label>分店名稱（選填）</label><input name="branchName" value="${esc(s.branchName||((String(s.name||"").match(/[（(]([^（）()]*)[）)]$/)||[])[1]||""))}" placeholder="例如：台中公益店"><div class="muted">品牌與分店分開記錄；要新增同品牌其他分店，請在店名下方按「＋ 新增分店」。</div></div><div class="row"><div class="field"><label>縣市</label><select name="county" id="formCounty"><option value="">請選縣市</option>${Object.keys(counties).map(c=>`<option ${s.county===c?"selected":""}>${c}</option>`).join("")}</select></div><div class="field"><label>鄉鎮市區</label><select name="town" id="formTown"><option value="">請先選縣市</option>${(counties[s.county]||[]).map(t=>`<option ${s.town===t?"selected":""}>${t}</option>`).join("")}</select></div></div><div class="field"><label>地址／地標</label><input name="address" value="${esc(s.address||"")}" placeholder="自行填寫地址"></div><div class="field"><label>營業時間</label><div class="muted">預設每天營業，只有固定公休日需要取消勾選。點時間欄位會開啟手機時鐘選擇器，可微調分鐘；每 30 分鐘一格，也可新增多個時段。新店預填 11:00–21:00，請依實際營業時間修改。</div><div id="hoursEditor"></div></div><div class="field"><label>這間店專屬的客製化選項</label><p class="muted">在建立或編輯這間店時，就能自己建立選項。例如這間火鍋店可設「湯底、辣度、加點醬料」；飲料店可設「甜度、冰量、加料」。不同店家各自管理，不會把其他店的選項混在一起。</p><div id="shopCustomOptionEditor">${(s.customOptions||[]).map((x,i)=>`<div class="row" style="margin:6px 0"><span style="flex:1">${esc(x)}</span><button type="button" class="danger smallbtn fit" data-removeshopoption="${i}">移除</button></div>`).join("")}</div><div class="row"><div class="field" style="flex:1"><label>新增選項名稱</label><input id="shopCustomOptionInput" placeholder="例如：湯底、辣度、醬料另外放"></div><button type="button" class="secondary" id="addShopCustomOption">＋ 新增選項</button></div></div><div class="field"><label>店家備註</label><textarea name="note" placeholder="推薦品項、停車資訊等">${esc(s.note||"")}</textarea></div><label class="check"><input type="checkbox" name="favorite" ${s.favorite!==false?"checked":""}>加入口袋名單</label><div class="row" style="margin-top:14px"><button type="submit">儲存店家</button><button type="button" class="ghost" data-page="${s.kind==="飲料店"?"drinks":"restaurants"}">取消</button>${s.id?`<button type="button" class="danger" id="deleteShop">刪除店家</button>`:""}</div></form>`}
function recordForm(s){let opts=s.menuItems||[];return `<h1>✍️ 記一筆</h1><div class="card"><b>${esc(s.name)}</b><div class="muted">${esc(s.kind)}</div><form id="recordForm"><input type="hidden" name="shopId" value="${s.id}"><div class="field"><label>日期</label><input type="date" name="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>吃過／喝過什麼</label>${opts.length?`<select name="selectedItem"><option value="">選擇菜單品項（或手動輸入）</option>${opts.map(x=>`<option value="${esc(x.name)}" data-price="${x.price}">${esc(x.name)} · NT$${esc(x.price)}</option>`).join("")}</select>`:""}<input name="items" placeholder="餐點或飲料名稱" required></div><div class="field"><label>這次實際花費（元）</label><input name="amount" type="number" min="0" step="1" placeholder="例如 120"></div><div class="field"><label>客製化選項（可複選）</label>${(s.customOptions||[]).length?`<div class="card" style="padding:10px">${(s.customOptions||[]).map((x,i)=>`<label class="check" style="display:flex;margin:7px 0"><input type="checkbox" name="customOption" value="${esc(x)}"> ${esc(x)}</label>`).join("")}</div>`:'<p class="muted">這間店還沒有客製化選項。請到店家資料按「編輯」，在「這間店專屬的客製化選項」建立。</p>'}<label>這次另外補充</label><textarea name="custom" placeholder="輸入這次特別的要求或調整"></textarea></div><div class="field"><label>心得</label><textarea name="note" placeholder="下次想點什麼、口味心得"></textarea></div><button type="submit">儲存這筆記錄</button></form></div>`}
function menuDisplay(s){
 const items=s.menuItems||[], menus=s.menus||[];
 const icons=["🍜","🍚","🍛","🍱","🥟","🍣","🍔","🍕","🥗","🍰","🧋","☕","🍵","🥤","🍦","🍗"];
 const iconFor=(name,i)=>{const n=String(name||"");if(/奶茶|茶飲|咖啡|拿鐵|果汁|飲料|紅茶|綠茶|烏龍|珍珠/.test(n))return "🧋";if(/飯|丼|便當|燴飯|炒飯/.test(n))return "🍚";if(/麵|拉麵|烏龍麵|義大利麵/.test(n))return "🍜";if(/餃|水餃|煎餃|包子/.test(n))return "🥟";if(/蛋糕|甜點|布丁|冰淇淋/.test(n))return "🍰";if(/披薩|比薩/.test(n))return "🍕";if(/漢堡/.test(n))return "🍔";return icons[i%icons.length]};
 const photos=menus.length?`<h2>📖 菜單照片</h2><p class="muted">這裡直接展示店家實際上傳的菜單圖片，點圖片可放大查看。</p><div class="menu-photo-gallery">${menus.map((m,i)=>`<section class="menu-photo-card"><div class="menu-photo-heading">${esc(m.versionName||("菜單 "+(i+1)))}${m.date?" · "+esc(m.date):""}</div><img class="menu-photo-view" src="${m.src}" alt="${esc(m.versionName||"店家菜單")}" data-zoom-menu="${i}"><div class="menu-photo-hint">點圖片放大</div></section>`).join("")}</div>`:`<div class="empty"><b>這家店還沒有上傳實際菜單圖片。</b><br>按「編輯菜單」→「上傳菜單圖片」，選擇店家菜單照片後，回到這裡就能直接瀏覽整張菜單。</div>`;
 const itemsBlock=items.length?`<details class="card" style="margin-top:14px"><summary style="font-weight:800;cursor:pointer;padding:4px">餐點名稱與價格清單（${items.length} 項）</summary><div class="menu-display-grid">${items.map((x,i)=>`<div class="menu-display-item"><div class="menu-display-icon">${esc(x.icon||iconFor(x.name,i))}</div><div class="menu-display-name">${esc(x.name)}</div><div class="menu-display-price">NT$${esc(x.price||0)}</div></div>`).join("")}</div></details>`:"";
 return `<div class="row" style="align-items:center;justify-content:space-between"><div><h1>📖 ${esc(s.name||s.brandName||"菜單")}</h1><div class="muted">菜單瀏覽模式</div></div><button class="secondary smallbtn fit" data-menu-edit="${s.id}">✏️ 編輯菜單</button></div><div class="card"><div><b>${esc(s.name||s.brandName||"店家")}</b><div class="muted">${menus.length} 張菜單圖片 · ${items.length} 個餐點選項</div></div>${photos}${itemsBlock}<div style="margin-top:14px"><button type="button" class="ghost" id="menuBackToShop">← 返回店家列表</button></div></div>`;
}
function menuForm(s){return `<h1>🧾 管理菜單</h1><div class="card"><b>${esc(s.name)}</b><div class="muted">${esc(regionLabel(s))}</div><div class="field"><label>這份菜單適用範圍</label><select id="menuScope"><option value="branch" ${(s.menuScope||"branch")==="branch"?"selected":""}>僅此店家</option><option value="region" ${s.menuScope==="region"?"selected":""}>同一地區版本</option><option value="brand" ${s.menuScope==="brand"?"selected":""}>其他店家共用</option></select><div class="muted">目前先記錄適用範圍；各店的菜單與價格仍分開保存，避免不同分店價格互相覆蓋。</div></div><div class="field"><label>菜單版本名稱（選填）</label><input id="menuVersionName" placeholder="例如：台北店 2026 秋季菜單"></div><div class="field"><label>上傳菜單圖片（可多張、可重複上傳）</label><input type="file" id="menuUpload" accept="image/*" multiple></div><div class="muted">上傳後可保留原圖，並建立裁切副本。每次新上傳都會新增版本，不會覆蓋舊菜單。</div><div>${(s.menus||[]).map((m,i)=>`<div class="card"><div class="muted">${esc(m.versionName||("菜單版本 "+(i+1)))} · ${esc(m.date)} · ${({branch:"此店家",region:"地區版本",brand:"共用版本"}[m.scope||"branch"])}</div><img class="menuimg" src="${m.src}" alt="菜單圖片"><div class="row"><button class="secondary smallbtn" data-cropmenu="${s.id}|${i}">✂️ 裁切圖片</button><button class="danger smallbtn" data-delmenu="${s.id}|${i}">刪除這張</button></div><div id="cropper-${i}"></div></div>`).join("")}</div><h3>餐點選項與目前價格</h3><p class="muted">圖片文字目前不會自動辨識，請確認後手動輸入。消費紀錄會保存當次實際金額。</p><div class="field"><label>餐點／飲料名稱</label><input id="itemName" placeholder="例如：珍珠奶茶"></div><div class="field"><label>目前菜單價格（元）</label><input id="itemPrice" type="number" min="0" placeholder="例如：65"></div><button id="addMenuItem">新增餐點選項</button><div style="margin-top:12px">${(s.menuItems||[]).map((x,i)=>`<div class="row card"><span>${esc(x.name)} · NT$${esc(x.price)}</span><button class="danger smallbtn fit" data-delitem="${s.id}|${i}">移除</button></div>`).join("")}</div><div class="row" style="margin-top:12px"><button type="button" class="secondary" id="menuEditorBack">← 返回菜單照片</button><button type="button" class="ghost" id="menuUpdate">完成並查看菜單</button></div></div>`}
function showNavEditor(item){
 const area=$("editCategoryArea"); if(!area){alert("請先開啟個人化設定再編輯。");return;}
 const choices=["🍜","🍱","🍢","🔥","🍲","🥟","🍔","🍕","🍣","🥗","🍰","🍩","☕","🧋","🥤","🍺","🍎","🏠","♡","💗","📖","📍","🧾","⚙️","🛍️","⭐","🎯","🐟","🥩","🍗","🌮","🥐"];
 area.innerHTML=`<div class="card" id="navEditor"><h4>編輯側邊選單</h4><div class="field"><label>顯示名稱</label><input id="navEditName" value="${esc(item.label)}" placeholder="例如：小吃、美食、燒烤"></div><div class="field"><label>選擇圖案（點一下即可）</label><div class="iconchoices">${choices.map(e=>`<button type="button" data-pickicon="${e}" class="${e===item.icon?'selected':''}">${e}</button>`).join("")}</div><label>或輸入自己的 Emoji</label><input id="navEditIcon" value="${esc(item.icon)}" maxlength="12" placeholder="例如：🍢"></div><div class="row"><button type="button" id="saveNavEdit">儲存修改</button><button type="button" class="ghost" id="cancelNavEdit">取消</button></div></div>`;
 const iconInput=$("navEditIcon"); area.querySelectorAll("[data-pickicon]").forEach(b=>b.onclick=()=>{iconInput.value=b.dataset.pickicon;area.querySelectorAll("[data-pickicon]").forEach(x=>x.classList.toggle("selected",x===b));});
 $("cancelNavEdit").onclick=()=>area.innerHTML="";
 $("saveNavEdit").onclick=()=>{const name=$("navEditName").value.trim(),icon=iconInput.value.trim();if(!name){alert("名稱不可空白");return}if(!icon){alert("請選擇或輸入圖案");return}
   if(item.type==="category"){const c=data.categories.find(x=>x.id===item.id);if(!c)return;if(data.categories.some(x=>x.id!==c.id&&x.name===name)||["餐廳","飲料店"].includes(name)){alert("這個名稱已存在，請換一個名稱");return}const old=c.name;c.name=name;c.icon=icon;data.shops.forEach(s=>{if(s.kind===old)s.kind=name});}
   else {let n=data.nav.find(x=>x.id===item.id);if(!n){n={id:item.id,show:true};data.nav.push(n)}n.label=name;n.icon=icon;}
   save();render();
 };
 area.scrollIntoView({behavior:"smooth",block:"center"});
}
function bind(){bindThemeSettings();document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>{kind=b.dataset.kind;render()});document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{page="edit";editingId=null;renderCustomForm(b.dataset.add)});document.querySelectorAll("[data-add-branch]").forEach(b=>b.onclick=()=>{const parent=data.shops.find(x=>x.id===b.dataset.addBranch);if(!parent)return;const brand=parent.brandName||String(parent.name||"").replace(/[（(][^（）()]*店[）)]$/,"").trim();renderCustomForm(parent.kind,{kind:parent.kind,brandName:brand,branchName:"",county:parent.county||"",town:parent.town||"",address:"",note:"",favorite:parent.favorite,menus:[],menuItems:[]})});document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{let s=data.shops.find(x=>x.id===b.dataset.edit);renderCustomForm(s.kind,s)});document.querySelectorAll("[data-record]").forEach(b=>{b.onclick=()=>{recordShop=b.dataset.record;let s=data.shops.find(x=>x.id===recordShop);$("view").innerHTML=recordForm(s);bindRecord(s)}});document.querySelectorAll("[data-menu]").forEach(b=>b.onclick=()=>{menuShop=b.dataset.menu;let s=data.shops.find(x=>x.id===menuShop);$("view").innerHTML=menuDisplay(s);bindMenuDisplay(s)});document.querySelectorAll("[data-delrecord]").forEach(b=>b.onclick=()=>{if(confirm("刪除這筆紀錄？")){data.records=data.records.filter(r=>r.id!==b.dataset.delrecord);save();render()}});if($("applyRegion"))$("applyRegion").onclick=()=>{data.regionCounty=$("county").value;data.regionTown=$("town").value;save();page="home";render()};if($("clearRegion"))$("clearRegion").onclick=()=>{data.regionCounty="全部";data.regionTown="全部";save();page="home";render()};if($("county"))$("county").onchange=()=>{$("town").innerHTML='<option>全部</option>'+(counties[$("county").value]||[]).map(t=>`<option>${t}</option>`).join("")};if($("export"))$("export").onclick=()=>{let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="今天吃什麼備份.json";a.click();URL.revokeObjectURL(a.href)};if($("importFile"))$("importFile").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(d.shops&&d.records){data=d;save();render();alert("匯入成功")}else alert("檔案格式不正確")}catch{alert("無法讀取備份")}};r.readAsText(f)};if($("clearAll"))$("clearAll").onclick=()=>{if(confirm("確定清除這個原型的所有資料？無法復原，請先備份。")){localStorage.removeItem("foodPocketPrototype");location.reload()}};document.querySelectorAll("[data-nav]").forEach(c=>c.onchange=()=>{let n=data.nav.find(x=>x.id===c.dataset.nav);if(!n){n={id:c.dataset.nav,label:navItems().find(x=>x.id===c.dataset.nav)?.label||c.dataset.nav,icon:navItems().find(x=>x.id===c.dataset.nav)?.icon||"🍽️",show:c.checked};data.nav.push(n)}n.show=c.checked;let cat=data.categories.find(x=>"cat_"+x.id===c.dataset.nav);if(cat)cat.show=c.checked;save();render()});document.querySelectorAll("[data-editnav]").forEach(b=>b.onclick=()=>{const id=b.dataset.editnav;const item=navItems().find(x=>x.id===id);showNavEditor({type:"nav",id,label:item?.label||"",icon:item?.icon||"🍽️"})});
if($("addCustomOption"))$("addCustomOption").onclick=()=>{let input=$("newCustomOption"),name=input.value.trim();if(!name){alert("請先輸入客製化選項名稱");return}data.customOptions=data.customOptions||[];if(data.customOptions.includes(name)){alert("這個選項已存在");return}data.customOptions.push(name);save();render()};document.querySelectorAll("[data-delcustomoption]").forEach(b=>b.onclick=()=>{let i=Number(b.dataset.delcustomoption);if(!Number.isInteger(i)||!data.customOptions)return;if(!confirm("確定刪除這個客製化選項？既有消費紀錄不會被刪除。"))return;data.customOptions.splice(i,1);save();render()});if($("addCategory"))$("addCategory").onclick=()=>{let name=$("newCategoryName").value.trim(),icon=$("newCategoryIcon").value.trim()||"🍽️";if(!name){alert("請先輸入分類名稱");return}if(["餐廳","飲料店"].includes(name)||data.categories.some(c=>c.name===name)){alert("這個名稱已存在，請換一個名稱");return}let c={id:crypto.randomUUID(),name,icon,show:true};data.categories.push(c);save();render();alert("已新增「"+name+"」分類！")};
document.querySelectorAll("[data-editcat]").forEach(b=>b.onclick=()=>{let c=data.categories.find(x=>x.id===b.dataset.editcat);if(!c)return;showNavEditor({type:"category",id:c.id,label:c.name,icon:c.icon||"🍽️"})});
document.querySelectorAll("[data-deletecat]").forEach(b=>b.onclick=()=>{let c=data.categories.find(x=>x.id===b.dataset.deletecat);if(!c)return;let count=data.shops.filter(s=>s.kind===c.name).length;if(!confirm(`確定刪除「${c.name}」分類？${count?`目前有 ${count} 間店家，店家資料會保留，但需要重新分類。`:""}`))return;if(count){alert("為避免店家資料失去分類，請先編輯這些店家的類型，再刪除分類。");return}data.categories=data.categories.filter(x=>x.id!==c.id);if(page==="cat:"+c.id)page="home";save();render()});
if($("formCounty"))$("formCounty").onchange=()=>{$("formTown").innerHTML='<option value="">請選鄉鎮市區</option>'+(counties[$("formCounty").value]||[]).map(t=>`<option>${t}</option>`).join("")};}
function hoursEditorHTML(schedule){
 return `<div class="card" style="padding:10px"><div class="row"><button type="button" class="secondary smallbtn" data-hours-quick="all">每天營業</button><button type="button" class="ghost smallbtn" data-hours-quick="none">全部公休</button></div>${schedule.map(d=>`<div class="hours-day" data-daycard="${d.day}"><div class="row"><strong style="flex:1">星期${d.day}</strong><label class="check" style="flex:0 0 auto"><input type="checkbox" data-dayopen="${d.day}" ${d.open?"checked":""}> 公休以外皆營業</label></div>${d.open?`<div data-periods="${d.day}">${d.periods.map((p,i)=>`<div class="card" style="padding:8px;margin:6px 0"><div class="row"><span class="muted">營業時段 ${i+1}</span><button type="button" class="danger smallbtn fit" data-delperiod="${d.day}|${i}">刪除</button></div><div class="row"><div class="field"><label>開始時間</label><input type="time" step="1800" data-periodstart="${d.day}|${i}" value="${esc(p.start)}"></div><div class="field"><label>結束時間</label><input type="time" step="1800" data-periodend="${d.day}|${i}" value="${esc(p.end)}"></div></div></div>`).join("")}</div><button type="button" class="ghost smallbtn" data-addperiod="${d.day}">＋ 新增時段</button>`:`<div class="muted" style="margin-top:6px">固定公休日</div>`}</div>`).join("")}</div>`;
}
function bindHoursEditor(schedule){
 const root=$("hoursEditor");if(!root)return;
 const draw=()=>{root.innerHTML=hoursEditorHTML(schedule);root.querySelectorAll("[data-dayopen]").forEach(el=>el.onchange=()=>{const d=schedule.find(x=>x.day===el.dataset.dayopen);d.open=el.checked;if(d.open&&!d.periods.length)d.periods=[{start:"11:00",end:"21:00"}];draw()});root.querySelectorAll("[data-addperiod]").forEach(el=>el.onclick=()=>{const d=schedule.find(x=>x.day===el.dataset.addperiod);d.open=true;d.periods.push({start:"11:00",end:"21:00"});draw()});root.querySelectorAll("[data-delperiod]").forEach(el=>el.onclick=()=>{const [day,i]=el.dataset.delperiod.split("|");const d=schedule.find(x=>x.day===day);d.periods.splice(Number(i),1);if(!d.periods.length)d.open=false;draw()});root.querySelectorAll("[data-periodstart]").forEach(el=>el.onchange=()=>{const [day,i]=el.dataset.periodstart.split("|");schedule.find(x=>x.day===day).periods[Number(i)].start=el.value});root.querySelectorAll("[data-periodend]").forEach(el=>el.onchange=()=>{const [day,i]=el.dataset.periodend.split("|");schedule.find(x=>x.day===day).periods[Number(i)].end=el.value});root.querySelectorAll("[data-hours-quick]").forEach(el=>el.onclick=()=>{if(el.dataset.hoursQuick==="all")schedule.forEach(d=>{d.open=true;if(!d.periods.length)d.periods=[{start:"11:00",end:"21:00"}]});else schedule.forEach(d=>{d.open=false;d.periods=[]});draw()})};draw();return schedule;
}

// 讓瀏覽器／手機的「上一頁」優先返回網站內上一個畫面，不退出網站。
(function(){
  function currentListPage(){
    try {
      if (typeof page !== "undefined" && typeof page === "string") {
        if (page === "menu") return "restaurants";
        return page;
      }
    } catch(e) {}
    return "restaurants";
  }
  window.addEventListener("popstate", function(){
    try {
      if (typeof render === "function") render();
    } catch(e) {}
  });
  window.__todayWhatToEatBack = function(){
    try {
      if (window.history.length > 1 && document.referrer && new URL(document.referrer).origin === location.origin) {
        history.back();
        return;
      }
    } catch(e) {}
    try {
      if (typeof page !== "undefined") {
        page = currentListPage();
        if (typeof render === "function") render();
        return;
      }
    } catch(e) {}
    location.hash = "#home";
  };
})();
