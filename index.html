if(page==='records'){main.innerHTML=`<section class="hero"><h1>📖 吃喝過記錄</h1><p>記下吃過／喝過的品項、金額、日期和心得。</p><div class="toolbar"><select id="recordType"><option value="all">全部記錄</option><option value="food">餐廳記錄</option><option value="drink">飲料記錄</option></select><input id="recordSearch" placeholder="搜尋店名或吃喝過的品項"></div></section><div id="recordList">${recordsHTML()}</div>`;$('#recordType').onchange=filterRecords;$('#recordSearch').oninput=filterRecords;return}
if(page==='settings'){main.innerHTML=`<section class="hero"><h1>⚙️ 地區與設定</h1><p>依全台灣、單一縣市或單一鄉鎮市區篩選口袋名單。地區清單涵蓋台灣本島及離島行政區。</p></section><section class="panel"><h2>預設地區篩選</h2><div class="grid"><label class="field">縣市<select id="setCounty">${countyOptions(data.filters.county)}</select></label><label class="field">鄉鎮市區<select id="setTown">${townOptions(data.filters.county,data.filters.town)}</select></label></div><button class="primary" id="saveFilters">儲存地區</button> <button class="ghost" id="exportData">匯出我的資料備份</button><label class="file-label">匯入資料備份<input id="importData" type="file" accept="application/json" hidden></label><p class="muted">資料儲存在目前這台裝置的瀏覽器中。若換手機或清除網站資料，請先匯出備份。</p></section>`;$('#setCounty').onchange=e=>{$('#setTown').innerHTML=townOptions(e.target.value)};$('#saveFilters').onclick=()=>{data.filters={county:$('#setCounty').value,town:$('#setTown').value};save();alert('地區設定已儲存');render()};$('#exportData').onclick=()=>{let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='今天吃什麼備份.json';a.click();URL.revokeObjectURL(a.href)};$('#importData').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(d.places&&d.records){data=d;save();render();alert('匯入完成')}}catch{alert('檔案格式不正確')}};return}}
function homeCards(opened){let type=$('#homeType')?.value||'all',county=$('#homeCounty')?.value??data.filters.county,town=$('#homeTown')?.value??data.filters.town;let list=opened.filter(p=>(type==='all'||p.type===type)&&(county===''||p.county===county)&&(town===''||p.town===town));return list.length?list.map(placeCard).join(''):'<div class="empty">目前沒有符合條件且營業中的店家。<br>可以新增店家並設定營業時間，或調整地區篩選。</div>'}function filterHome(){$('#homeCards').innerHTML=homeCards(data.places.filter(isOpen))}function placeCards(list){let c=$('#filterCounty')?.value??data.filters.county,t=$('#filterTown')?.value??data.filters.town;list=list.filter(p=>(!c||p.county===c)&&(!t||p.town===t));return list.length?list.map(placeCard).join(''):'<div class="empty">這裡還沒有店家，點「新增」把喜歡的店收進口袋吧。</div>'}function filterPlaces(){let q=$('#searchPlace').value.toLowerCase(),list=data.places.filter(p=>p.type===(page==='drinks'?'drink':'food')&&[p.name,p.address,p.note,p.category].join(' ').toLowerCase().includes(q));$('#placeCards').innerHTML=placeCards(list)}
function placeForm(p){p=p||{};let type=p.type||'food',hours=p.hours?.length?p.hours:[{days:'每天',open:'11:00',close:'14:00'},{days:'每天',open:'17:00',close:'21:00'}];return `<section class="panel"><h2>${p.id?'編輯店家':'店家資料'}</h2><form id="placeForm"><input type="hidden" id="placeId" value="${esc(p.id||'')}"><div class="grid"><label class="field">店家類型<select id="pType"><option value="food" ${type==='food'?'selected':''}>餐廳／吃的</option><option value="drink" ${type==='drink'?'selected':''}>飲料店／喝的</option></select></label><label class="field">店家名稱 *<input id="pName" required value="${esc(p.name||'')}" placeholder="例如：某某麵店／手搖飲"></label><label class="field">分類／標籤<input id="pCategory" value="${esc(p.category||'')}" placeholder="例如：麵類、早午餐、珍珠奶茶"></label><label class="field">縣市<select id="pCounty">${countyOptions(p.county||'')}</select></label><label class="field">鄉鎮市區<select id="pTown">${townOptions(p.county||'',p.town||'')}</select></label><label class="field">地址<input id="pAddress" value="${esc(p.address||'')}" placeholder="路名、門牌"></label><label class="field">電話（選填）<input id="pPhone" value="${esc(p.phone||'')}"></label></div><div class="field">營業時間（可新增多個時段）</div><div id="hoursRows">${hours.map(hourRow).join('')}</div><button type="button" class="ghost" id="addHours">＋ 新增營業時段</button><label class="field" style="margin-top:14px">店家備註<textarea id="pNote" placeholder="例如：推薦品項、停車資訊、想再試的餐點">${esc(p.note||'')}</textarea></label><label class="field">上傳菜單圖片（選填）<input type="file" id="pMenu" accept="image/*"><span class="muted">可以上傳菜單照片；圖片會儲存在這台裝置的瀏覽器。</span></label>${p.menu?`<img class="menuimg" src="${p.menu}" alt="目前菜單"><label><input type="checkbox" id="removeMenu"> 移除目前菜單</label>`:''}<div class="actions"><button class="primary" type="submit">${p.id?'儲存修改':'加入口袋名單'}</button><button type="button" class="ghost" onclick="go('${p.type==='drink'?'drinks':'restaurants'}')">取消</button></div></form></section>`}function hourRow(h={days:'每天',open:'09:00',close:'18:00'}){return `<div class="grid hour-row" style="align-items:end"><label class="field">星期<select class="hDays"><option ${h.days==='每天'?'selected':''}>每天</option><option ${h.days==='週一至週五'?'selected':''}>週一至週五</option><option ${h.days==='週六至週日'?'selected':''}>週六至週日</option><option ${h.days==='週一'?'selected':''}>週一</option><option ${h.days==='週二'?'selected':''}>週二</option><option ${h.days==='週三'?'selected':''}>週三</option><option ${h.days==='週四'?'selected':''}>週四</option><option ${h.days==='週五'?'selected':''}>週五</option><option ${h.days==='週六'?'selected':''}>週六</option><option ${h.days==='週日'?'selected':''}>週日</option></select></label><div style="display:flex;gap:6px;align-items:end"><label class="field" style="flex:1">開始<input type="time" class="hOpen" value="${esc(h.open||'09:00')}"></label><label class="field" style="flex:1">結束<input type="time" class="hClose" value="${esc(h.close||'18:00')}"></label><button type="button" class="danger remove-hour" style="margin-bottom:12px">−</button></div></div>`}function wireForm(){let cf=$('#pCounty');cf.onchange=()=>$('#pTown').innerHTML=townOptions(cf.value);$('#addHours').onclick=()=>$('#hoursRows').insertAdjacentHTML('beforeend',hourRow());$('#hoursRows').onclick=e=>{if(e.target.classList.contains('remove-hour'))e.target.closest('.hour-row').remove()};$('#placeForm').onsubmit=async e=>{e.preventDefault();let id=$('#placeId').value||crypto.randomUUID(),old=data.places.find(p=>p.id===id),file=$('#pMenu').files[0],menu=old?.menu||'';if($('#removeMenu')?.checked)menu='';if(file){if(file.size>3*1024*1024){alert('菜單圖片請選擇 3MB 以下的檔案。');return}menu=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}let hours=$$('.hour-row').map(r=>({days:r.querySelector('.hDays').value,open:r.querySelector('.hOpen').value,close:r.querySelector('.hClose').value})).filter(h=>h.open&&h.close);let p={id,type:$('#pType').value,name:$('#pName').value.trim(),category:$('#pCategory').value.trim(),county:cf.value,town:$('#pTown').value,address:$('#pAddress').value.trim(),phone:$('#pPhone').value.trim(),hours,note:$('#pNote').value.trim(),menu,menuName:file?.name||old?.menuName||''};if(old)data.places=data.places.map(x=>x.id===id?p:x);else data.places.unshift(p);save();go(p.type==='drink'?'drinks':'restaurants')}}
function newPlace(type){editId=null;page='add';render();$('#pType').value=type}function editPlace(id){let p=data.places.find(x=>x.id===id);page='add';render();$('#main').innerHTML=`<section class="hero"><h1>編輯店家</h1></section>${placeForm(p)}`;wireForm()}function deletePlace(id){if(confirm('確定刪除這間店？相關吃喝記錄也會一併刪除。')){data.places=data.places.filter(p=>p.id!==id);data.records=data.records.filter(r=>r.placeId!==id);save();render()}}function recordFor(id){let p=data.places.find(p=>p.id===id);page='records';render();let box=document.createElement('section');box.className='panel';box.innerHTML=`<h2>新增吃喝記錄：${esc(p.name)}</h2>${recordForm(id)}`;$('#main').prepend(box);wireRecordForm()}
function recordForm(placeId=''){let options=data.places.map(p=>`<option value="${p.id}" ${p.id===placeId?'selected':''}>${p.type==='drink'?'🧋':'🍚'} ${esc(p.name)}</option>`).join('');return `<form id="recordForm"><label class="field">店家<select id="rPlace" required>${options}</select></label><div class="grid"><label class="field">日期<input type="date" id="rDate" value="${new Date().toISOString().slice(0,10)}" required></label><label class="field">這次花費金額（元）<input type="number" min="0" step="1" id="rAmount" placeholder="例如 120"></label></div><label class="field">吃過／喝過什麼？<input id="rItem" required placeholder="例如：牛肉麵、小珍珠奶茶"></label><label class="field">備註／心得<textarea id="rNote" placeholder="甜度、口味、下次想點什麼……"></textarea></label><div class="actions"><button class="primary" type="submit">儲存這筆記錄</button></div></form>`}function wireRecordForm(){let f=$('#recordForm');if(!f)return;f.onsubmit=e=>{e.preventDefault();data.records.unshift({id:crypto.randomUUID(),placeId:$('#rPlace').value,date:$('#rDate').value,item:$('#rItem').value.trim(),amount:$('#rAmount').value===''?null:Number($('#rAmount').value),note:$('#rNote').value.trim()});save();page='records';render()}}
function recordsHTML(placeId=null){let list=data.records.filter(r=>!placeId||r.placeId===placeId);return list.length?list.map(r=>{let p=data.places.find(p=>p.id===r.placeId);return `<div class="panel record"><div class="section-title"><strong>${p?.type==='drink'?'🧋':'🍚'} ${esc(p?.name||'已刪除的店家')}</strong><span class="muted">${esc(r.date)}</span></div><div>${esc(r.item)} ${r.amount!==null&&r.amount!==undefined?`<strong>｜$${r.amount}</strong>`:''}</div>${r.note?`<div class="muted">${esc(r.note)}</div>`:''}<div class="actions"><button class="danger" onclick="deleteRecord('${r.id}')">刪除記錄</button></div></div>`}).join(''):'<div class="empty">還沒有吃喝記錄。新增一筆，記住吃過什麼、花了多少錢。</div>'}function filterRecords(){let type=$('#recordType').value,q=$('#recordSearch').value.toLowerCase();let list=data.records.filter(r=>{let p=data.places.find(p=>p.id===r.placeId);return(type==='all'||p?.type===type)&&[p?.name,r.item,r.note].join(' ').toLowerCase().includes(q)});$('#recordList').innerHTML=list.length?list.map(r=>{let p=data.places.find(p=>p.id===r.placeId);return `<div class="panel record"><div class="section-title"><strong>${p?.type==='drink'?'🧋':'🍚'} ${esc(p?.name||'已刪除的店家')}</strong><span class="muted">${esc(r.date)}</span></div><div>${esc(r.item)} ${r.amount!==null&&r.amount!==undefined?`<strong>｜$${r.amount}</strong>`:''}</div>${r.note?`<div class="muted">${esc(r.note)}</div>`:''}<div class="actions"><button class="danger" onclick="deleteRecord('${r.id}')">刪除記錄</button></div></div>`}).join(''):'<div class="empty">沒有符合條件的記錄。</div>'}function deleteRecord(id){if(confirm('確定刪除這筆記錄？')){data.records=data.records.filter(r=>r.id!==id);save();render()}}function showRecords(id){page='records';render();$('#recordType').value='all';$('#recordSearch').value='';$('#recordList').innerHTML=recordsHTML(id)}function go(p){page=p;render();window.scrollTo(0,0)}$$('.nav').forEach(b=>b.onclick=()=>go(b.dataset.page));render();setInterval(()=>{if(page==='home')filterHome()},30000);if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
